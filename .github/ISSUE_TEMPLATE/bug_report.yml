name: Bug report
description: Report something that isn't working as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please redact any API keys or trace contents that you don't want public before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the tool you called and any error message.
      placeholder: I called `getTrace` and got…
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we trigger this?
      placeholder: |
        1. Set env vars …
        2. Run …
        3. See …
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.11.1
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: langfuse-mcp version
      description: Output of `npx langfuse-mcp --version` or the version in your package.json.
      placeholder: 1.2.0
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Langfuse deployment
      options:
        - Langfuse Cloud (EU)
        - Langfuse Cloud (US)
        - Self-hosted
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - Cursor
        - Cline
        - Continue
        - Windsurf
        - Other (describe in additional context)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Copy any relevant logs from your MCP client. Redact secrets.
      render: text
